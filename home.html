<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stadtbibliothek Karlsruhe · Switch Spiele</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>Stadtbibliothek Karlsruhe</h1>
      <p>Nintendo Switch · offline Metascore &amp; HowLongToBeat</p>
    </div>
    <div class="stat" id="count">…</div>
  </header>

  <section class="filters">
    <input id="q" type="search" placeholder="Titel suchen…" />
    <select id="party">
      <option value="all">Alle Parties</option>
      <option value="first">First Party (Nintendo)</option>
      <option value="third">Third Party</option>
    </select>
    <select id="score">
      <option value="0">Metascore: alle</option>
      <option value="90">≥ 90</option>
      <option value="85">≥ 85</option>
      <option value="80">≥ 80</option>
      <option value="70">≥ 70</option>
    </select>
    <select id="time">
      <option value="all">Spieldauer: alle</option>
      <option value="short">&lt; 10 Std.</option>
      <option value="mid">10–25 Std.</option>
      <option value="long">&gt; 25 Std.</option>
    </select>
    <select id="density">
      <option value="0">Dichte: egal</option>
      <option value="2">≥ 2 Pkt./Std.</option>
      <option value="5">≥ 5 Pkt./Std.</option>
      <option value="8">≥ 8 Pkt./Std.</option>
      <option value="12">≥ 12 Pkt./Std.</option>
    </select>
    <button id="reset" type="button" hidden>Filter zurücksetzen</button>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="title">Titel</th>
          <th data-sort="firstParty">Party</th>
          <th data-sort="metacriticScore">Metascore</th>
          <th data-sort="howlongtobeatHours">Spieldauer</th>
          <th data-sort="density">Dichte</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <span id="range"></span>
    <div class="pager">
      <button id="prev" type="button">Zurück</button>
      <span id="page"></span>
      <button id="next" type="button">Weiter</button>
      <select id="pageSize">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="0">Alle</option>
      </select>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
